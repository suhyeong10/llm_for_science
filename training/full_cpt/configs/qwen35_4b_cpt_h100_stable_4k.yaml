run:
  name: "qwen35_4b_cpt_h100_stable_4k"
  output_dir: "outputs/qwen35_4b_cpt_h100_stable_4k"
  seed: 42
  report_to: ["wandb"]
  log_interval_steps: 10
  save_interval_steps: 500
  eval_interval_steps: 500
  save_total_limit: 4

model:
  base_model: "Qwen/Qwen3.5-4B-Base"
  trust_remote_code: true
  torch_dtype: "bfloat16"
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  attn_implementation: "sdpa"

tokenizer:
  use_fast: true
  padding_side: "right"
  truncation_side: "right"
  add_special_tokens: true

data:
  train_file: "data/processed/corpus_v1/train.jsonl"
  valid_file: "data/processed/corpus_v1/valid.jsonl"
  text_field: "text"
  preprocessing_num_workers: 8
  pack_sequences: true
  max_seq_length: 4096
  add_eos_token: true

optimizer:
  name: "adamw_torch_fused"
  learning_rate: 1.0e-5
  weight_decay: 0.1
  betas: [0.9, 0.95]
  eps: 1.0e-8
  max_grad_norm: 1.0

scheduler:
  type: "cosine"
  warmup_ratio: 0.03

trainer:
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 32
  num_train_epochs: 1
  max_steps: -1
  bf16: true
  fp16: false
  dataloader_num_workers: 4
  dataloader_pin_memory: true
  remove_unused_columns: false
  evaluation_strategy: "steps"
  save_strategy: "steps"
  logging_strategy: "steps"

runtime:
  device: "cuda"
  expected_gpus: 1
  gpu_type_hint: "H100-80GB"
  tf32: true

