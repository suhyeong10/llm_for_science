run:
  name: "smoke"
  output_dir: "training/full_cpt/tests/out_smoke"
  seed: 42
  report_to: []
  log_interval_steps: 1
  save_interval_steps: 5
  eval_interval_steps: 5
  save_total_limit: 1

model:
  base_model: "sshleifer/tiny-gpt2"
  local_debug_tiny: true
  trust_remote_code: false
  torch_dtype: "auto"
  gradient_checkpointing: false

tokenizer:
  use_fast: true
  padding_side: "right"
  truncation_side: "right"
  add_special_tokens: true

data:
  train_file: "training/full_cpt/tests/smoke_train.jsonl"
  valid_file: "training/full_cpt/tests/smoke_valid.jsonl"
  text_field: "text"
  preprocessing_num_workers: 1
  max_seq_length: 64
  add_eos_token: true

optimizer:
  learning_rate: 5.0e-4
  weight_decay: 0.0
  betas: [0.9, 0.999]
  eps: 1.0e-8
  max_grad_norm: 1.0

scheduler:
  type: "linear"
  warmup_ratio: 0.0

trainer:
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 1
  num_train_epochs: 1
  max_steps: 5
  bf16: false
  fp16: false
  dataloader_num_workers: 0
  dataloader_pin_memory: false
  remove_unused_columns: false
  evaluation_strategy: "steps"
  save_strategy: "steps"
  logging_strategy: "steps"
