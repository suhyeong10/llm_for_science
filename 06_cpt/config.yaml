# =============================================================================
# CPT 중형 모델 학습 설정
# 담당자: 김승환
#
# 수정해야 할 부분:
#   1. data.path                   : 수형님 서버의 통합 데이터 경로
#   2. data.science_source_values  : 통합본에서 "과학"으로 간주할 source 값
#   3. data.general_source_values  : 통합본에서 "일반"으로 간주할 source 값
#   4. model.base                  : 모델 베이스 (미확정 — 결정되면 한 줄만 수정)
#   5. gpu.num_devices             : 실행 환경에 맞춰 GPU 장 수
# =============================================================================

# ─── 모델 ───────────────────────────────────────────────────────────────────
model:
  # TBD — 중형 모델 베이스 미확정.
  # 후보: Qwen/Qwen2.5-7B, Qwen/Qwen3-8B-Base, meta-llama/Meta-Llama-3-8B
  # 결정되면 이 한 줄만 바꾸면 됩니다.
  base: "Qwen/Qwen2.5-7B"
  torch_dtype: "bfloat16"
  trust_remote_code: true
  # FSDP가 wrapping할 디코더 레이어 클래스명 (모델에 맞게 변경)
  # Qwen2/2.5: Qwen2DecoderLayer, Llama: LlamaDecoderLayer
  fsdp_transformer_layer_cls: "Qwen2DecoderLayer"

# ─── 데이터 ─────────────────────────────────────────────────────────────────
data:
  # 수형님 서버의 통합 데이터 경로
  # (parquet 파일 / jsonl / 디렉토리 / HF save_to_disk 디렉토리 모두 자동 인식)
  path: "/path/to/suhyeong_server/integrated_corpus"

  # peS2o 스키마 필드 (id, source, url, text, created, added, version)
  schema: "peS2o"
  source_field: "source"
  text_field: "text"

  # source 필드에서 "과학"으로 간주할 값들
  # 수형님 통합본은 대부분 이 값. 추가 값 있으면 리스트에 더하면 됨.
  science_source_values: ["pes2o_or_crawled"]

  # source 필드에서 "일반"으로 간주할 값들
  # 통합본에 일반 데이터가 없으면 빈 리스트로 두고 mixing.general_fallback_hf 사용.
  general_source_values: ["general"]

  # 80~85% 과학 + 15~20% 일반 비율 동적 검증·보정
  mixing:
    science_ratio_min: 0.80
    science_ratio_max: 0.85

    # ─────────────────────────────────────────────────────────────────────
    # 두 가지 모드 — auto_balance 토글
    #
    #   🅰️ 검증만 모드  (auto_balance: false)
    #       80/20 맞나 확인하고 안 맞으면 경고만 띄우고 진행.
    #       HF 다운로드 X. 수형님 통합 데이터를 그대로 신뢰.
    #
    #   🅱️ 보정까지 모드 (auto_balance: true)  ← 기본값
    #       안 맞으면 HF 데이터셋에서 자동으로 보충해서 비율을 맞춤.
    #       (과학 부족 → peS2o 보충, 일반 부족 → fineweb 보충)
    # ─────────────────────────────────────────────────────────────────────
    auto_balance: true
    science_fallback_hf: "allenai/peS2o"
    general_fallback_hf: "HuggingFaceFW/fineweb"
    fallback_streaming: true
    fallback_text_field_science: "text"
    fallback_text_field_general: "text"

  # ─── 시퀀스 패킹 ─────────────────────────────────────────────────────────
  # 짧은 문서들을 EOS로 이어붙여 max_seq_length를 꽉 채워 학습.
  # padding 90%+ 제거 → 같은 시간에 학습하는 토큰량 5~10배 증가.
  packing:
    enabled: true
    # 패킹 후 train/eval 분할 — eval 비율
    eval_split: 0.005

# ─── 학습 ───────────────────────────────────────────────────────────────────
training:
  output_dir: "./checkpoints"
  num_epochs: 1
  per_device_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 2.0e-5
  lr_scheduler_type: "cosine"   # CPT 표준
  warmup_ratio: 0.03
  weight_decay: 0.01
  max_seq_length: 4096
  gradient_checkpointing: true
  bf16: true
  save_steps: 1000
  eval_steps: 1000              # eval과 save 동기화 → best 체크포인트 선택 가능
  logging_steps: 50
  save_total_limit: 3
  load_best_model_at_end: true  # 학습 종료 시 eval loss 최저 체크포인트 자동 복원
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  seed: 42
  preprocess_num_proc: 8
  # 모니터링: tensorboard / wandb / none
  report_to: "tensorboard"

# ─── GPU / 분산 ────────────────────────────────────────────────────────────
gpu:
  # 실행 환경의 GPU 장 수 (run.sh의 CUDA_VISIBLE_DEVICES로 오버라이드 가능)
  num_devices: 4
  # FSDP — 7B + Adam optimizer states는 단일 GPU 메모리에 안 들어가므로
  # full_shard로 params/grads/optim_states를 모든 GPU에 분산.
  fsdp:
    enabled: true
    # full_shard | shard_grad_op | hybrid_shard | no_shard
    sharding_strategy: "full_shard"
    # CPU 오프로딩 (메모리 부족 시 활성화 — 속도는 느려짐)
    offload_params: false
    mixed_precision: "bf16"
    # 체크포인트 저장 방식 — FULL은 rank0에 모아 저장 (호환성 좋음)
    state_dict_type: "FULL_STATE_DICT"
